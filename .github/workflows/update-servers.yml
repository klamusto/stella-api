name: update-servers

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-servers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and decode
        run: python fetch_servers.py

      - name: Commit servers.json
        run: |
          git config user.name "stella-api-bot"
          git config user.email "stella-api-bot@users.noreply.github.com"
          if git diff --quiet -- servers.json cache.json; then
            echo "no changes"
            exit 0
          fi
          git add servers.json cache.json
          git commit -m "servers: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
