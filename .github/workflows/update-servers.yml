name: update-servers

on:
  # Backup restarter only. The real cadence comes from refresh_loop.py, which
  # re-queues this workflow every few minutes because GitHub's scheduler can
  # delay or silently skip */5 ticks.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-servers
  # Never kill a run mid-commit; a queued run starts right after it ends.
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh every 5 minutes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFRESH_SECONDS: "300"
          REFRESH_ROUNDS: "9"
          REFRESH_WORKFLOW: "update-servers.yml"
          REFRESH_REF: "main"
        run: python refresh_loop.py
